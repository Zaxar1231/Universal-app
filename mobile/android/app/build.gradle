apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

android {
    namespace = "io.github.zaxar1231.universal"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.zaxar1231.universal"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // в CI: ./gradlew assembleRelease -PversionName=1.6.0 -PversionCode=10600
        versionCode((project.findProperty('versionCode') ?: '1') as Integer)
        versionName(project.findProperty('versionName') ?: '1.0')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // 64-битные телефоны (arm64-v8a): встроенный Python 3.12 (Chaquopy) 32-битные не поддерживает
        // для эмулятора в CI: -Pabis=x86_64
        ndk { abiFilters(*((project.findProperty('abis') ?: 'arm64-v8a').split(','))) }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Ключ лежит в репозитории, чтобы каждая новая версия ставилась поверх старой.
        // Свой секретный ключ: секреты ANDROID_KEYSTORE_BASE64 и ANDROID_KEYSTORE_PASSWORD (см. mobile/README.md).
        release {
            storeFile file(System.getenv('UNIVERSAL_KEYSTORE') ?: 'universal.jks')
            storePassword System.getenv('UNIVERSAL_KEYSTORE_PASSWORD') ?: 'universal-public'
            keyAlias System.getenv('UNIVERSAL_KEY_ALIAS') ?: 'universal'
            keyPassword System.getenv('UNIVERSAL_KEYSTORE_PASSWORD') ?: 'universal-public'
        }
    }
    packaging {
        // youtubedl-android достаёт Python и ffmpeg из нативных библиотек: они должны лежать распакованными
        jniLibs { useLegacyPackaging = true }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // скачивание видео прямо на телефоне: yt-dlp + Python + ffmpeg + QuickJS (как в YTDLnis)
    implementation "io.github.junkfood02.youtubedl-android:library:0.18.1"
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    // полная версия на телефоне: OCR (Tesseract) и голос в текст (Vosk)
    implementation "com.github.adaptech-cz.Tesseract4Android:tesseract4android:4.9.0"
    implementation "com.alphacephei:vosk-android:0.3.75"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Полная версия Universal на телефоне: тот же сервер, что на компьютере (app.py и модули рядом),
// работает на встроенном Python. Код сервера кладёт в src/main/python/universal_srv скрипт mobile/build-www.mjs.
chaquopy {
    defaultConfig {
        version = "3.12"
        def bp = System.getenv('CHAQUOPY_BUILD_PYTHON')
        if (bp) buildPython(bp)
        pip {
            install "flask"
            install "pillow"
            install "qrcode"
            install "pypdf"
            install "yt-dlp"
            install "-r", "../../../requirements-android.txt"   // встроенный конвертер документов (pydocs)
        }
        // код и файлы сервера (шаблоны, static) распаковываются в обычные файлы: Flask читает их с диска
        extractPackages("universal_srv")
    }
}
