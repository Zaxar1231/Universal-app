name: Тесты

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      STT_REAL: "1"          # настоящее распознавание голосового моделью Whisper
      UNIVERSAL_HOME: ${{ github.workspace }}/../universal-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Модель Whisper из кэша
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../universal-home/whisper
          key: whisper-base-v1
      - name: Программы
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg imagemagick pandoc poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-rus espeak-ng
      - name: Зависимости
        run: pip install -r requirements.txt pytest
      - name: Тесты
        run: python -m pytest -q -rs -k "not test_stt_real" && python -m pytest -q -s -k test_stt_real

  windows:
    # тесты на Windows с движками, которые ставит само приложение (проверяет и ссылки на них)
    runs-on: windows-latest
    env:
      UNIVERSAL_HOME: ${{ github.workspace }}\..\universal-home
      GITHUB_TOKEN: ${{ github.token }}      # у API без токена общий лимит на IP раннера
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Зависимости
        run: pip install -r packaging/requirements-desktop.txt pytest
      - name: Движки через engines.py
        shell: bash
        run: |
          python engines.py install ffmpeg pandoc poppler imagemagick ytdlp tesseract
          python -c "import json,engines;[print(v) for k,v in json.load(open(engines.engines_dir()/'paths.json')).items() if k!='ytdlp']" >> "$GITHUB_PATH"
      - name: Тесты
        run: python -m pytest -q
      - name: Самопроверка desktop.py
        run: python desktop.py --smoke
