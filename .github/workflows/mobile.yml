name: Телефоны

# APK для Android и IPA для iPhone (без подписи Apple, ставится через AltStore/Sideloadly).
# На PR и пуши, которые трогают приложение, собирается и кладётся в артефакты;
# из release.yml вызывается с версией и выкладывает файлы в релиз.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
  pull_request:
    paths: ["mobile/**", "site/**", "downloader.py", ".github/workflows/mobile.yml"]
  push:
    branches: [main]
    paths: ["mobile/**", "site/**", "downloader.py", ".github/workflows/mobile.yml"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Версия
        id: v
        run: |
          V="${{ inputs.version }}"
          [ -n "$V" ] || V="$(node -p "require('./package.json').version")"
          V="${V#v}"
          IFS=. read -r A B C <<< "$V"
          C="${C%%[!0-9]*}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${A:-0} * 10000 + ${B:-0} * 100 + ${C:-0} ))" >> "$GITHUB_OUTPUT"
      - name: Веб-часть
        env:
          UNIVERSAL_VERSION: ${{ steps.v.outputs.version }}
        run: npm ci && node build-www.mjs && npx cap sync android
      - name: Свой ключ подписи (если задан в секретах)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.HAS_KEY == 'true'
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "UNIVERSAL_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "UNIVERSAL_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "UNIVERSAL_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS || 'universal' }}" >> "$GITHUB_ENV"
      - name: Сборка APK
        working-directory: mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon -PversionName=${{ steps.v.outputs.version }} -PversionCode=${{ steps.v.outputs.code }}
          cp app/build/outputs/apk/release/app-release.apk "../Universal-${{ steps.v.outputs.version }}-android.apk"
      - name: Проверка подписи
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs Universal-*-android.apk | head -3
          "$BT/aapt2" dump badging Universal-*-android.apk | head -1
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/Universal-*-android.apk
      - name: В релиз
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ steps.v.outputs.version }}" Universal-*-android.apk --clobber

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Версия
        id: v
        run: |
          V="${{ inputs.version }}"
          [ -n "$V" ] || V="$(node -p "require('./package.json').version")"
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"
      - name: Веб-часть
        env:
          UNIVERSAL_VERSION: ${{ steps.v.outputs.version }}
        run: npm ci && node build-www.mjs && npx cap sync ios
      - name: Сборка .app без подписи
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION=${{ steps.v.outputs.version }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -20
          test -d build/Build/Products/Release-iphoneos/App.app
      - name: IPA
        run: |
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Payload/App.app/Info.plist
          zip -qry "Universal-${{ steps.v.outputs.version }}-ios-unsigned.ipa" Payload
          ls -la *.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: mobile/Universal-*-ios-unsigned.ipa
      - name: В релиз
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ steps.v.outputs.version }}" Universal-*-ios-unsigned.ipa --clobber
